<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cashflow Champions | F1 Manager Stats</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --f1-red: #e10600;
            --f1-black: #0b0e11;
            --f1-dark: #15191e;
            --f1-glass: rgba(255, 255, 255, 0.05);
            --f1-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--f1-black);
            color: white;
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at top right, #1a202c, #0b0e11);
            min-height: 100vh;
        }

        .f1-font { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel {
            background: var(--f1-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--f1-border);
            border-radius: 12px;
        }

        .card-rank-1 { border-left: 4px solid #ffd700; background: linear-gradient(90deg, rgba(255,215,0,0.1), transparent); }
        .card-rank-2 { border-left: 4px solid #c0c0c0; }
        .card-rank-3 { border-left: 4px solid #cd7f32; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--f1-black); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--f1-red); }

        .mode-active { background-color: var(--f1-red) !important; color: white !important; }
        
        .hidden-mode { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- HEADER SECTION -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <h1 class="f1-font text-4xl md:text-5xl font-black italic tracking-tighter">
                    CASHFLOW <span class="text-[--f1-red]">CHAMPIONS</span>
                </h1>
                <p id="pageSubtitle" class="text-gray-400 mt-2 uppercase tracking-[0.2em] text-xs font-bold">Laden van paddock data...</p>
            </div>

            <!-- MODE SELECTOR -->
            <div class="flex bg-gray-900 p-1 rounded-full border border-gray-700 shadow-xl">
                <button onclick="setUIMode('easy')" id="btn-easy" class="px-6 py-2 rounded-full text-xs font-bold transition-all hover:bg-gray-800">EASY</button>
                <button onclick="setUIMode('medium')" id="btn-medium" class="px-6 py-2 rounded-full text-xs font-bold transition-all hover:bg-gray-800 mode-active">MEDIUM</button>
                <button onclick="setUIMode('pro')" id="btn-pro" class="px-6 py-2 rounded-full text-xs font-bold transition-all hover:bg-gray-800">PRO MODE</button>
            </div>
        </header>

        <!-- KPI GRID -->
        <section class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10" id="kpiGrid"></section>

        <!-- STANDINGS GRID -->
        <h2 class="f1-font text-xl mb-6 flex items-center gap-3">
            <span class="w-2 h-8 bg-[--f1-red] block"></span> WERELDKLASSEMENT
        </h2>
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12" id="cardsGrid"></section>

        <!-- CHARTS SECTION (Medium & Pro) -->
        <section id="chartSection" class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
            <div class="glass-panel p-6">
                <h3 class="f1-font text-sm text-[--f1-red] mb-6 uppercase">Puntenontwikkeling</h3>
                <div id="lineChart" class="w-full h-80"></div>
                <div id="lineLegend" class="flex flex-wrap gap-4 mt-6 text-[10px]"></div>
            </div>
            <div class="glass-panel p-6">
                <h3 id="latestRoundTitle" class="f1-font text-sm text-[--f1-red] mb-6 uppercase">Ronde Resultaat</h3>
                <div id="roundBarTable" class="space-y-4"></div>
            </div>
        </section>

        <!-- HISTORY TABLE (Pro only) -->
        <section id="historySection" class="hidden-mode">
            <h2 class="f1-font text-xl mb-6 flex items-center gap-3">
                <span class="w-2 h-8 bg-blue-600 block"></span> VOLLEDIGE TELEMETRIE (HISTORIE)
            </h2>
            <div class="glass-panel overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse" id="historyTable"></table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const DATA = {
            rounds: [
                { name: "GP Australië", totals: { "KNOAL TEMPO TEAM": 229, "WILD ROLLER COASTERS": 221, "VONCK RACING": 214, "ARJAN RACING 007": 194, "HUNTER RACING TEAM": 116, "FANNY'S RACING TEAM": 96, "MTJIRAN": 78 } },
                { name: "GP China", totals: { "VONCK RACING": 473, "KNOAL TEMPO TEAM": 415, "ARJAN RACING 007": 411, "WILD ROLLER COASTERS": 408, "MTJIRAN": 310, "FANNY'S RACING TEAM": 289, "HUNTER RACING TEAM": 267 } },
                { name: "GP Japan", totals: { "VONCK RACING": 623, "KNOAL TEMPO TEAM": 543, "WILD ROLLER COASTERS": 538, "ARJAN RACING 007": 517, "FANNY'S RACING TEAM": 470, "HUNTER RACING TEAM": 435, "MTJIRAN": 371 } }
            ],
            palette: ["#e10600", "#3671C6", "#27F4D2", "#FFF500", "#FF8700", "#5A5A5A", "#F596C8", "#00D2BE"]
        };

        // UI Mode Switcher
        function setUIMode(mode) {
            const chartSect = document.getElementById('chartSection');
            const historySect = document.getElementById('historySection');
            
            // Buttons updaten
            ['easy', 'medium', 'pro'].forEach(m => document.getElementById('btn-'+m).classList.remove('mode-active'));
            document.getElementById('btn-'+mode).classList.add('mode-active');

            // Secties tonen/verbergen
            if(mode === 'easy') {
                chartSect.classList.add('hidden-mode');
                historySect.classList.add('hidden-mode');
            } else if(mode === 'medium') {
                chartSect.classList.remove('hidden-mode');
                historySect.classList.add('hidden-mode');
            } else {
                chartSect.classList.remove('hidden-mode');
                historySect.classList.remove('hidden-mode');
            }
        }

        // --- DE LOGICA (HERGEBRUIKT & VERFIJND) ---
        function uniqueTeams(rounds) {
            const set = new Set();
            rounds.forEach(r => Object.keys(r.totals).forEach(t => set.add(t)));
            return [...set];
        }

        function sortDescByValue(mapObj) {
            return Object.entries(mapObj).sort((a, b) => b[1] - a[1]);
        }

        function buildRoundMeta(rounds, teams) {
            return rounds.map((round, index) => {
                const prevTotals = index === 0 ? {} : rounds[index - 1].totals;
                const roundScores = {};
                teams.forEach(team => {
                    roundScores[team] = (round.totals[team] || 0) - (prevTotals[team] || 0);
                });
                const cumulativeRanking = sortDescByValue(Object.fromEntries(teams.map(t => [t, round.totals[t] || 0]))).map(([team]) => team);
                const roundRanking = sortDescByValue(roundScores).map(([team]) => team);
                
                const cumulativePosition = {};
                cumulativeRanking.forEach((team, i) => cumulativePosition[team] = i + 1);

                const positionChange = {};
                if (index > 0) {
                    const prevRanking = sortDescByValue(rounds[index-1].totals).map(([team]) => team);
                    teams.forEach(team => {
                        const oldPos = prevRanking.indexOf(team) + 1;
                        const newPos = cumulativeRanking.indexOf(team) + 1;
                        positionChange[team] = oldPos - newPos;
                    });
                }

                return { name: round.name, totals: round.totals, roundScores, cumulativeRanking, cumulativePosition, roundRanking, positionChange };
            });
        }

        const teams = uniqueTeams(DATA.rounds);
        const roundMeta = buildRoundMeta(DATA.rounds, teams);
        const lastRound = roundMeta[roundMeta.length - 1];
        const teamColors = Object.fromEntries(lastRound.cumulativeRanking.map((team, i) => [team, DATA.palette[i % DATA.palette.length]]));

        document.getElementById('pageSubtitle').textContent = `PADDOCK LIVE // STAND NA ${lastRound.name}`;

        function renderKPIs() {
            const leader = lastRound.cumulativeRanking[0];
            const winner = lastRound.roundRanking[0];
            
            const kpis = [
                { label: 'P1 Leader', val: leader, sub: lastRound.totals[leader] + ' PTS' },
                { label: 'Round Winner', val: winner, sub: lastRound.roundScores[winner] + ' PTS' },
                { label: 'Grid Size', val: teams.length, sub: 'Geregistreerd' },
                { label: 'Grootste Klim', val: '▲ ' + Math.max(...Object.values(lastRound.positionChange || {x:0})), sub: 'Positiewinst' },
                { label: 'Rondes', val: DATA.rounds.length, sub: 'Afgerond' }
            ];

            document.getElementById('kpiGrid').innerHTML = kpis.map(k => `
                <div class="glass-panel p-4 border-b-2 border-b-[--f1-red]">
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">${k.label}</p>
                    <p class="f1-font text-lg font-bold truncate">${k.val}</p>
                    <p class="text-[10px] text-[--f1-red] font-bold">${k.sub}</p>
                </div>
            `).join('');
        }

        function renderCards() {
            document.getElementById('cardsGrid').innerHTML = lastRound.cumulativeRanking.map((team, i) => {
                const rank = i + 1;
                const change = lastRound.positionChange[team] || 0;
                const changeClass = change > 0 ? 'text-green-500' : (change < 0 ? 'text-red-500' : 'text-gray-500');
                const changeIcon = change > 0 ? '▲' : (change < 0 ? '▼' : '•');

                return `
                    <div class="glass-panel p-5 relative overflow-hidden card-rank-${rank}">
                        <div class="absolute right-[-10px] bottom-[-10px] f1-font text-6xl opacity-5 italic font-black">${rank}</div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="f1-font text-xs font-bold text-gray-500">RANK ${rank}</span>
                            <span class="${changeClass} font-bold text-xs">${changeIcon} ${Math.abs(change)}</span>
                        </div>
                        <h3 class="f1-font text-md font-bold mb-1 truncate">${team}</h3>
                        <p class="text-2xl font-black italic mb-4">${lastRound.totals[team]} <span class="text-[10px] font-normal not-italic text-gray-500">PTS</span></p>
                        <div class="grid grid-cols-2 gap-2 text-[10px] uppercase font-bold text-gray-400">
                            <div class="bg-black/30 p-2 rounded">Round: <span class="text-white">${lastRound.roundScores[team]}</span></div>
                            <div class="bg-black/30 p-2 rounded">Avg: <span class="text-white">${(lastRound.totals[team]/DATA.rounds.length).toFixed(0)}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderBars() {
            const max = Math.max(...Object.values(lastRound.roundScores));
            document.getElementById('roundBarTable').innerHTML = lastRound.roundRanking.map(team => {
                const perc = (lastRound.roundScores[team] / max) * 100;
                return `
                    <div>
                        <div class="flex justify-between text-[10px] mb-1 font-bold uppercase">
                            <span>${team}</span>
                            <span>${lastRound.roundScores[team]} PTS</span>
                        </div>
                        <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-1000" style="width: ${perc}%; background: ${teamColors[team]}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLineChart() {
            const width = 600, height = 300, padding = 40;
            const allValues = DATA.rounds.flatMap(r => Object.values(r.totals));
            const max = Math.max(...allValues);
            const xStep = (width - padding * 2) / (DATA.rounds.length - 1);
            
            let svg = `<svg viewBox="0 0 ${width} ${height}" class="w-full h-full">`;
            
            // Lijnen tekenen
            teams.forEach((team, idx) => {
                const color = teamColors[team];
                let points = "";
                DATA.rounds.forEach((r, i) => {
                    const x = padding + (i * xStep);
                    const y = height - padding - ((r.totals[team] || 0) / max * (height - padding * 2));
                    points += `${x},${y} `;
                    svg += `<circle cx="${x}" cy="${y}" r="3" fill="${color}" />`;
                });
                svg += `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" />`;
            });
            svg += `</svg>`;
            
            document.getElementById('lineChart').innerHTML = svg;
            document.getElementById('lineLegend').innerHTML = teams.map(t => `
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${teamColors[t]}"></span> ${t}</div>
            `).join('');
        }

        function renderHistory() {
            let html = `<thead class="bg-black/50 text-[10px] uppercase tracking-wider text-gray-500"><tr><th class="p-4">Team</th>`;
            DATA.rounds.forEach(r => html += `<th class="p-4 text-center">${r.name}</th>`);
            html += `</tr></thead><tbody>`;
            
            lastRound.cumulativeRanking.forEach(team => {
                html += `<tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                    <td class="p-4 font-bold text-xs">${team}</td>`;
                DATA.rounds.forEach(r => {
                    html += `<td class="p-4 text-center text-xs">
                        <div class="font-bold">${r.totals[team]}</div>
                        <div class="text-[9px] text-gray-500">PTS</div>
                    </td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody>`;
            document.getElementById('historyTable').innerHTML = html;
        }

        // Init
        renderKPIs();
        renderCards();
        renderBars();
        renderLineChart();
        renderHistory();
        setUIMode('medium'); // Default naar Medium

    </script>
</body>
</html>
